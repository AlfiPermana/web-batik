services:
    # Laravel Application (Nginx + PHP-FPM + Supervisor)
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        image: web-batik:latest
        container_name: batik-app
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            APP_NAME: "Batik Giri Alam"
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: "base64:JTOO7wbaGuMM7v1/nn8NB7G0UcvROe0CTJdHiArc1oo=" # Change in actual production
            APP_URL: "http://207.180.227.185:8080"

            # Database
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: db_web_batik
            DB_USERNAME: laravel_user
            DB_PASSWORD: laravel_password

            # Session, Cache, Queue via Redis
            SESSION_DRIVER: redis
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379

            # Auto-run Migrations on Startup
            RUN_MIGRATIONS: "true"
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        volumes:
            - app_storage:/var/www/html/storage

    # MySQL Database
    db:
        image: mysql:8.0
        container_name: batik-db
        restart: unless-stopped
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: db_web_batik
            MYSQL_USER: laravel_user
            MYSQL_PASSWORD: laravel_password
            MYSQL_ROOT_PASSWORD: root_password
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-u",
                    "laravel_user",
                    "-plaravel_password",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    # Redis Cache & Queue
    redis:
        image: redis:alpine
        container_name: batik-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    # Cloudflare Quick Tunnel
    tunnel:
        image: cloudflare/cloudflared:latest
        container_name: batik-tunnel
        restart: unless-stopped
        command: tunnel --url http://app:80
        depends_on:
            - app

volumes:
    app_storage:
    mysql_data:
    redis_data:
